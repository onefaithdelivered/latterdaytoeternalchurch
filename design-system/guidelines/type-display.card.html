<!-- @dsCard group="Type" viewport="700x180" name="Display — Playfair Display" subtitle="Headings & hero display · 700 / 900, occasional italic" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-display); color: var(--ink); }
  .wrap { padding: 22px 26px; }
  .big { font-size: 42px; font-weight: 900; color: var(--crimson); line-height: 1.05; letter-spacing: -0.5px; }
  .big em { color: var(--gold); font-style: normal; }
  .sub { font-size: 19px; font-weight: 700; color: var(--ink); margin-top: 10px; }
  .ital { font-size: 16px; font-style: italic; font-weight: 400; color: var(--dark-crimson); margin-top: 6px; }
  .tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-top: 12px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="big">Behind <em>the Veil</em></div>
    <div class="sub">Seven Weeks: From Lodge to Endowment</div>
    <div class="ital">A house built on sand</div>
    <div class="tag">--font-display · 900 / 700 / 400 italic</div>
  </div>
</body>
</html>
