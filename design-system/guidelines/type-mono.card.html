<!-- @dsCard group="Type" viewport="700x160" name="Mono — JetBrains Mono" subtitle="Eyebrow labels, meta & dates · 600, UPPERCASE, tracked" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-mono); color: var(--ink); }
  .wrap { padding: 22px 26px; display: flex; flex-direction: column; gap: 14px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: var(--dark-gold); }
  .meta { font-size: 11px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
  .date { font-size: 13px; font-weight: 600; letter-spacing: 0.05em; color: var(--crimson); }
  .tag { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">I — The Masonic Connection</div>
    <div class="meta">Long-Form Essay · Temple &amp; Ritual · Historical Analysis</div>
    <div class="date">1842 · 1990 · 2023</div>
    <div class="tag">--font-mono · 600 · uppercase · tracking 0.1–0.15em</div>
  </div>
</body>
</html>
