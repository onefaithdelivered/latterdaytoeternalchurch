<!-- @dsCard group="Colors" viewport="700x150" name="Brand — Crimson & Gold" subtitle="Primary ecclesiastical palette" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-mono); }
  .row { display: flex; gap: 14px; padding: 20px; }
  .sw { flex: 1; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow-xs); }
  .chip { height: 64px; }
  .meta { padding: 8px 10px; background: var(--white); }
  .name { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); }
  .hex { font-size: 11px; color: var(--muted); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#8B0000"></div><div class="meta"><div class="name">Crimson</div><div class="hex">#8B0000 · --crimson</div></div></div>
    <div class="sw"><div class="chip" style="background:#5C0000"></div><div class="meta"><div class="name">Dark Crimson</div><div class="hex">#5C0000 · --dark-crimson</div></div></div>
    <div class="sw"><div class="chip" style="background:#C5A55A"></div><div class="meta"><div class="name">Gold</div><div class="hex">#C5A55A · --gold</div></div></div>
    <div class="sw"><div class="chip" style="background:#8B7335"></div><div class="meta"><div class="name">Dark Gold</div><div class="hex">#8B7335 · --dark-gold</div></div></div>
  </div>
</body>
</html>
