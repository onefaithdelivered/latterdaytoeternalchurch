<!-- @dsCard group="Brand" viewport="700x150" name="Wordmark" subtitle="Playfair Display 700, crimson — the text-based brand mark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); display: flex; }
  .wrap { padding: 28px 30px; display: flex; flex-direction: column; gap: 16px; }
  .mark { font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: 0.05em; color: var(--crimson); }
  .mark-dark { background: var(--grad-hero); padding: 14px 20px; border-radius: var(--radius-md); display: inline-block; }
  .mark-dark .t { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: 0.05em; color: var(--parchment); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">One Faith Delivered</div>
    <div class="mark-dark"><span class="t">One Faith Delivered</span></div>
  </div>
</body>
</html>
