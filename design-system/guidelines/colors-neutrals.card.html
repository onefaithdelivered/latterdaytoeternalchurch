<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals — Warm Parchment & Ink" subtitle="Backgrounds, surfaces, text & hairlines" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-mono); }
  .row { display: flex; gap: 12px; padding: 20px; }
  .sw { flex: 1; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow-xs); }
  .chip { height: 56px; }
  .meta { padding: 7px 9px; background: var(--white); }
  .name { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink); }
  .hex { font-size: 10px; color: var(--muted); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#FAF6F0"></div><div class="meta"><div class="name">Parchment 2</div><div class="hex">#FAF6F0</div></div></div>
    <div class="sw"><div class="chip" style="background:#F5F0E8"></div><div class="meta"><div class="name">Parchment</div><div class="hex">#F5F0E8</div></div></div>
    <div class="sw"><div class="chip" style="background:#EDE7DB"></div><div class="meta"><div class="name">Sunken</div><div class="hex">#EDE7DB</div></div></div>
    <div class="sw"><div class="chip" style="background:#D0C8B8"></div><div class="meta"><div class="name">Line</div><div class="hex">#D0C8B8</div></div></div>
    <div class="sw"><div class="chip" style="background:#666666"></div><div class="meta"><div class="name">Muted</div><div class="hex">#666666</div></div></div>
    <div class="sw"><div class="chip" style="background:#2A2A2A"></div><div class="meta"><div class="name">Ink</div><div class="hex">#2A2A2A</div></div></div>
  </div>
</body>
</html>
