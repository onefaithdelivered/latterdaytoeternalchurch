<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); }
  .wrap { padding: 26px 30px; display: flex; flex-direction: column; gap: 22px; }
  .orn { color: var(--gold); font-size: 14px; letter-spacing: 12px; text-align: center; }
  .divider { display: flex; align-items: center; gap: 16px; }
  .line { flex: 1; height: 1px; background: var(--line); }
  .label { font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: var(--dark-gold); white-space: nowrap; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="orn">✦ &nbsp; ✦ &nbsp; ✦</div>
    <div class="divider"><div class="line"></div><span class="label">III — Shared Elements</span><div class="line"></div></div>
  </div>
</body>
</html>
