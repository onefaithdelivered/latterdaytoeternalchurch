<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-body); color: var(--ink); }
  .wrap { padding: 22px 26px; }
  .lead { font-size: 17px; font-weight: 300; font-style: italic; color: var(--muted); line-height: 1.5; }
  .body { font-size: 16px; font-weight: 400; line-height: 1.85; margin-top: 10px; max-width: 600px; }
  .body strong { color: var(--crimson); font-weight: 600; }
  .tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-top: 12px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="lead">The Masonic origins of the temple ceremony.</div>
    <div class="body">The timeline is not in dispute. Exactly seven weeks later, Joseph Smith introduced the temple endowment ceremony to nine men — <strong>every single one a Freemason</strong>.</div>
    <div class="tag">--font-body · 400 body · 600 emphasis · 300 italic lead</div>
  </div>
</body>
</html>
